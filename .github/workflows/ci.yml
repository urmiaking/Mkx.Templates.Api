name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build application
        working-directory: template-content
        run: dotnet build Mkx.Templates.slnx -c Release
      - name: Test application
        working-directory: template-content
        run: dotnet test --project Tests/Mkx.Templates.Tests/Mkx.Templates.Tests.csproj -c Release
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check live OpenAPI contract and generated SDK drift
        working-directory: template-content
        run: |
          python3 tools/export_openapi.py --check --configuration Release
          python3 tools/generate_sdks.py --check
      - name: Verify TypeScript SDK
        working-directory: template-content/clients/typescript
        run: |
          npm ci --ignore-scripts --no-audit
          npm test
      - name: Verify Dart SDK
        working-directory: template-content/clients/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: Package template
        run: dotnet pack Mkx.Templates.Api.csproj -c Release -o artifacts
      - name: Instantiate and verify packaged template
        shell: bash
        run: |
          PKG=$(find artifacts -maxdepth 1 -name 'Mkx.Templates.Api.*.nupkg' -print -quit)
          test -n "$PKG"
          dotnet new install "./$PKG"
          dotnet new mkx-api -n Smoke.Api -o "$RUNNER_TEMP/generated"
          dotnet build "$RUNNER_TEMP/generated/Smoke.Api.slnx" -c Release
          cd "$RUNNER_TEMP/generated"
          dotnet test --project Tests/Smoke.Api.Tests/Smoke.Api.Tests.csproj -c Release
          python3 tools/export_openapi.py --check --configuration Release
          python3 tools/generate_sdks.py --check
          cd clients/typescript
          npm ci --ignore-scripts --no-audit
          npm test
          cd ../dart
          dart pub get
          dart analyze --fatal-infos
          dart test
